<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>PayPal Autonomous OS</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17243a;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #dfe6f0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(27 50 88 / 8%);
      }

      .eyebrow {
        color: #1269a8;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 12px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      p {
        max-width: 54ch;
        color: #526178;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 20px;
        padding: 9px 13px;
        border: 1px solid #cdebdc;
        border-radius: 999px;
        color: #176c43;
        background: #effaf4;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e9b5f;
      }

      .note {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid #e8edf4;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Starter workspace</div>
      <h1>PayPal Autonomous OS</h1>
      <p>
        The app shell is ready. This starter serves the page and a health endpoint;
        PayPal workflows have not been connected here yet.
      </p>
      <div class="status" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="service-status">Checking service…</span>
      </div>
      <p class="note">
        PayPal credentials belong in Replit Secrets, not in the local environment file.
      </p>
    </main>
    <script>
      fetch("/health")
        .then((response) => {
          if (!response.ok) throw new Error("Health check failed");
          return response.json();
        })
        .then(() => {
          document.querySelector("#service-status").textContent = "Node.js service is running";
        })
        .catch(() => {
          document.querySelector("#service-status").textContent = "Service status unavailable";
        });
    </script>
  </body>
</html>
